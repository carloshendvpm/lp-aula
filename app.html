<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo HTML CSS JS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .btn-primary {
      background: #d84040;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary:hover {
      background: #9a2222;
      transform: translateY(-2px);
    }

    .message {
      margin-top: 16px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="btn-primary" id="button">Clique aqui</button>

  <p class="message" id="message"></p>

  <script>
    const button = document.querySelector("#button");
    const message = document.querySelector("#message");

    button.addEventListener("click", function () {
      button.textContent = "Você clicou!";
      message.textContent = "O JavaScript fez a página reagir ao clique.";
    });
  </script>
</body>
</html>
